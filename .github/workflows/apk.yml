# يبني تطبيق منبر الأصلي (Flutter) ويرفع ملف APK
name: بناء تطبيق منبر APK
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: إنشاء مشروع أندرويد
        working-directory: native
        run: flutter create --org com.minbar --project-name minbar_native --platforms android --no-pub .
      - name: تعديل أندرويد (صوت بالخلفية)
        working-directory: native
        run: python3 ci/patch_android.py
      - name: مفتاح التوقيع الثابت
        run: mkdir -p ~/.android && cp native/ci/debug.keystore ~/.android/debug.keystore
      - name: الحزم
        working-directory: native
        run: flutter pub get
      - name: الأيقونة وشاشة البداية
        working-directory: native
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: تجهيز Gradle (إعادة محاولة عند أعطال التحميل)
        working-directory: native
        run: |
          flutter build apk --config-only || true
          cd android && for i in 1 2 3 4 5 6; do ./gradlew --version && exit 0; echo "retry $i"; sleep 60; done; exit 1
      - name: بناء
        working-directory: native
        run: |
          for i in 1 2 3; do flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} && exit 0; echo "retry $i"; sleep 45; done; exit 1
      - name: بصمة التوقيع (من ملف APK نفسه)
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs native/build/app/outputs/flutter-apk/app-release.apk | grep -iE "SHA-1|SHA-256"
          $AS verify --print-certs native/build/app/outputs/flutter-apk/app-release.apk | grep -qi "33:e9:a1:92\|33e9a192" && echo OK-SIGNATURE || (echo "توقيع غير مطابق"; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: minbar-apk
          path: native/build/app/outputs/flutter-apk/app-release.apk
      - name: نشر كإصدار (للتحميل المباشر)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp native/build/app/outputs/flutter-apk/app-release.apk minbar.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest minbar.apk --title "منبر APK" --notes "build:${{ github.run_number }}" --prerelease
