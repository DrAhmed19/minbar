# يبني تطبيق منبر الأصلي (Flutter) ويرفع ملف APK
name: بناء تطبيق منبر APK
on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: إنشاء مشروع أندرويد
        working-directory: native
        run: flutter create --org com.minbar --project-name minbar_native --platforms android --no-pub .
      - name: تعديل أندرويد (صوت بالخلفية)
        working-directory: native
        run: python3 ci/patch_android.py
      - name: مفتاح التوقيع الثابت
        env: { KS_PASS: '${{ secrets.KS_PASS }}' }
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::أضف السر KS_PASS في إعدادات المستودع"; exit 1; fi
          mkdir -p ~/.android && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in native/ci/ks.enc -out ~/.android/debug.keystore -pass env:KS_PASS
      - name: الحزم
        working-directory: native
        run: flutter pub get
      - name: تحليل الكود (للمراجعة فقط)
        working-directory: native
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true; grep -E "^\s*(error|warning) " analyze.txt | head -150 || true; tail -2 analyze.txt
      - name: الأيقونة وشاشة البداية
        working-directory: native
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: تجهيز Gradle (إعادة محاولة عند أعطال التحميل)
        working-directory: native
        run: |
          flutter build apk --config-only || true
          cd android && for i in 1 2 3 4 5 6; do ./gradlew --version && exit 0; echo "retry $i"; sleep 60; done; exit 1
      - name: بناء
        working-directory: native
        run: |
          for i in 1 2 3; do flutter build apk --release --obfuscate --split-debug-info=build/symbols --split-per-abi --target-platform android-arm64,android-arm,android-x64 --build-number=${{ github.run_number }} --dart-define=BUILD=${{ github.run_number }} && exit 0; echo "retry $i"; sleep 45; done; exit 1
      - name: بصمة التوقيع (من ملف APK نفسه)
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs native/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -iE "SHA-1|SHA-256"
          $AS verify --print-certs native/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -qi "33:e9:a1:92\|33e9a192" && echo OK-SIGNATURE || (echo "توقيع غير مطابق"; exit 1)
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: minbar-apk
          path: native/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 2
      - name: نشر كإصدار (للتحميل المباشر)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          O=native/build/app/outputs/flutter-apk
          cp $O/app-arm64-v8a-release.apk minbar.apk
          cp $O/app-armeabi-v7a-release.apk minbar-arm32.apk
          cp $O/app-x86_64-release.apk minbar-x64.apk
          ls -la *.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest minbar.apk minbar-arm32.apk minbar-x64.apk --title "منبر APK" --notes "build:${{ github.run_number }}" --prerelease
      - name: نشر نسخة عامة في minbar-releases (رابط تحميل للجميع)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          RT: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [ -z "$RT" ] && { echo "RELEASES_TOKEN غير مضاف بعد — تخطي"; exit 0; }
          N=${{ github.run_number }}; D=$(mktemp -d)
          cp minbar.apk minbar-arm32.apk $D/ && cp .github/deploy/README.md $D/README.md && echo $N > $D/version.txt
          cd $D && git init -q -b main && git add -A
          git -c user.name="minbar-ci" -c user.email="ci@minbar" commit -qm "منبر — النسخة $N"
          git push -f "https://x-access-token:$RT@github.com/DrAhmed19/minbar-releases.git" main
      - name: تسجيل رقم البناء في Firestore (لتنبيه التحديث داخل التطبيق)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SA }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i --no-save google-auth-library@9 >/dev/null 2>&1
          node .github/scripts/setbuild.mjs ${{ github.run_number }}
