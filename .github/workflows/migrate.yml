name: ترحيل الكلمات
on:
  workflow_dispatch:
    inputs:
      apply: { description: 'تطبيق (true/false)', default: 'false' }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q google-cloud-firestore
      - env:
          APPLY: ${{ inputs.apply }}
        run: |
          echo '${{ secrets.FIREBASE_SA }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          python tools/migrate_lyrics.py
      - uses: actions/upload-artifact@v4
        with: { name: lyrics-backup, path: backup.json, retention-days: 30 }
