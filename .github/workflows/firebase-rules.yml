# ينشر قواعد Firestore تلقائياً كلما تغيّر الملف firestore.rules
name: نشر قواعد Firebase
on:
  push:
    branches: [main]
    paths: [firestore.rules, .github/**]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: مفتاح الخدمة
        run: echo '${{ secrets.FIREBASE_SA }}' > "$RUNNER_TEMP/sa.json"
      - name: نشر القواعد
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm i --no-save google-auth-library@9 >/dev/null 2>&1
          node .github/scripts/rules.mjs
