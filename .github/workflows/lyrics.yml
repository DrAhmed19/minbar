# ضبط كلمات القصائد على الصوت تلقائياً (بدل التحليل البطيء على الهاتف)
name: ضبط الكلمات
on:
  workflow_dispatch:
    inputs:
      album: { description: 'اسم الإصدار (فارغ = القصائد المنتظرة فقط)', default: '' }
      write: { description: 'حفظ النتيجة (true/false)', default: 'false' }
      limit: { description: 'أقصى عدد قصائد', default: '50' }
      only: { description: 'قصيدة واحدة بالاسم (اختياري)', default: '' }
      vocals: { description: 'فصل صوت الرادود عن اللطم', default: 'true' }
      restore: { description: 'إرجاع التوقيت اليدوي السابق', default: 'false' }
  schedule:
    - cron: '*/20 * * * *'
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: tools/requirements.txt }
      - run: sudo apt-get update -q >/dev/null; sudo apt-get install -y -q build-essential >/dev/null
      - run: pip install -q -r tools/requirements.txt && sudo apt-get install -y -q ffmpeg >/dev/null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: whisper-demucs-v1
      - name: ضبط
        env:
          ALBUM: ${{ inputs.album }}
          WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.write }}
          LIMIT: ${{ inputs.limit }}
          ONLY: ${{ inputs.only }}
          VOCALS: ${{ inputs.vocals || 'true' }}
          RESTORE: ${{ inputs.restore }}
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          echo '${{ secrets.FIREBASE_SA }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          python tools/align.py
