# يتأكد أن كل ملفات KV القديمة صارت تُقدَّم من R2
name: فحص نقل الصوت
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: فحص
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          ACC: 1981a0cd0beaed7d247862f8a9436cce
        run: |
          A="Authorization: Bearer $CF_TOKEN"
          NS=$(curl -s -H "$A" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces?per_page=100" | python3 -c "import sys,json; j=json.load(sys.stdin); print(j.get('errors') or ''); [print(n['id']) for n in j.get('result',[]) if n['title']=='minbar-media']" | tail -1)
          echo "ns=$NS"; [ -z "$NS" ] && exit 1
          : > keys.txt; CUR=""
          for i in $(seq 1 50); do
            R=$(curl -s -H "$A" "https://api.cloudflare.com/client/v4/accounts/$ACC/storage/kv/namespaces/$NS/keys?limit=1000${CUR:+&cursor=$CUR}")
            echo "$R" | python3 -c "import sys,json; [print(k['name']) for k in json.load(sys.stdin)['result']]" >> keys.txt
            CUR=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result_info',{}).get('cursor') or '')")
            [ -z "$CUR" ] && break
          done
          echo "KV keys: $(wc -l < keys.txt)"
          ok=0; bad=0
          while read -r k; do
            st=$(curl -sI "https://minbar-95z.pages.dev/media/u/$k" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-store"{print $2}')
            if [ "$st" = "r2" ]; then ok=$((ok+1)); else bad=$((bad+1)); echo "NOT-IN-R2 $k ($st)"; fi
          done < keys.txt
          echo "R2 ok=$ok not=$bad"
