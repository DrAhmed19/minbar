name: minbar_native
description: منبر - مشغّل القصائد واللطميات
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  workmanager: ^0.10.10
  connectivity_plus: ^7.0.0
  speech_to_text: ^7.0.0
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  app_links: ^6.3.3
  wakelock_plus: ^1.2.8
  flutter_svg: ^2.0.10+1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 700
    - family: F0
      fonts:
        - asset: assets/fonts/F0.ttf
    - family: F1
      fonts:
        - asset: assets/fonts/F1.ttf
    - family: F2
      fonts:
        - asset: assets/fonts/F2.ttf
    - family: F3
      fonts:
        - asset: assets/fonts/F3.ttf
    - family: F4
      fonts:
        - asset: assets/fonts/F4.ttf
    - family: F5
      fonts:
        - asset: assets/fonts/F5.ttf
    - family: F6
      fonts:
        - asset: assets/fonts/F6.ttf
    - family: F7
      fonts:
        - asset: assets/fonts/F7.ttf
    - family: F8
      fonts:
        - asset: assets/fonts/F8.ttf
    - family: F9
      fonts:
        - asset: assets/fonts/F9.ttf
    - family: F10
      fonts:
        - asset: assets/fonts/F10.ttf
    - family: F11
      fonts:
        - asset: assets/fonts/F11.ttf
    - family: F12
      fonts:
        - asset: assets/fonts/F12.ttf
    - family: F13
      fonts:
        - asset: assets/fonts/F13.ttf
    - family: F14
      fonts:
        - asset: assets/fonts/F14.ttf
    - family: F15
      fonts:
        - asset: assets/fonts/F15.ttf
    - family: F16
      fonts:
        - asset: assets/fonts/F16.ttf
    - family: F17
      fonts:
        - asset: assets/fonts/F17.ttf
    - family: CairoLatin
      fonts:
        - asset: assets/fonts/CairoLatin.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon-512.png
  adaptive_icon_background: '#0c4a39'
  adaptive_icon_foreground: assets/icon-maskable-512.png

flutter_native_splash:
  color: '#072a20'
  image: assets/brand-mark.png
  android_12:
    color: '#072a20'
    image: assets/brand-mark.png
